{{define "content"}}
{{$d := .Data}}
<header class="page-head"><div><nav class="crumbs" aria-label="Location"><a href="/iam/roles">Roles</a></nav><h1>New role</h1></div></header>
<form method="post" action="/iam/roles" class="stack wide">
  {{template "csrf" .}}
  <label>Role name <input name="name" value="{{$d.Name}}" required spellcheck="false"></label>
  <label>Path <input name="path" value="{{$d.Path}}" placeholder="/" spellcheck="false"></label>
  <label>Description <input name="description" value="{{$d.Description}}"></label>
  <label>Maximum session duration, in seconds <input name="maxSession" type="number" min="3600" max="43200" value="{{$d.MaxSession}}" placeholder="3600"></label>
  <label>Trust policy, JSON <textarea name="trust" rows="14" spellcheck="false" class="mono" required{{if $d.Error}} aria-describedby="form-error"{{end}}>{{$d.Trust}}</textarea></label>
  <p class="hint">The trust policy names the principals that may assume the role. Attach policies to say what its sessions may do.</p>
  {{template "formfailure" $d.Error}}
  <button type="submit" class="primary">Create role</button>
</form>
{{end}}
