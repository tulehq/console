{{define "content"}}
{{$d := .Data}}{{$o := $d.Owner}}
<header class="page-head">
  <div><nav class="crumbs" aria-label="Location"><a href="{{$o.ListLink}}">{{$o.ListTitle}}</a> <span aria-hidden="true">/</span> <a href="{{$o.Link}}">{{$o.Name}}</a></nav><h1>{{if $d.New}}New inline policy{{else}}{{$d.Name}}{{end}}</h1></div>
  {{- if not $d.New}}
  <div class="actions">
    <form method="post" action="/iam/{{$o.Kind}}/policy/delete" class="inline" data-confirm="Delete inline policy {{$d.Name}}?">{{template "csrf" .}}<input type="hidden" name="{{$o.Kind}}" value="{{$o.Name}}"><input type="hidden" name="name" value="{{$d.Name}}"><button type="submit" class="danger">Delete policy</button></form>
  </div>
  {{- end}}
</header>
<form method="post" action="/iam/{{$o.Kind}}/policy" class="stack wide">
  {{template "csrf" .}}<input type="hidden" name="{{$o.Kind}}" value="{{$o.Name}}">
  {{- if $d.New}}<input type="hidden" name="new" value="true">
  <label>Policy name <input name="name" value="{{$d.Name}}" required spellcheck="false"></label>
  {{- else}}<input type="hidden" name="name" value="{{$d.Name}}">{{end}}
  <label>Policy document, JSON <textarea name="document" rows="18" spellcheck="false" class="mono" required{{if $d.Error}} aria-describedby="form-error"{{end}}>{{$d.Document}}</textarea></label>
  {{template "formfailure" $d.Error}}
  <button type="submit" class="primary">{{if $d.New}}Create policy{{else}}Save policy{{end}}</button>
</form>
{{end}}
